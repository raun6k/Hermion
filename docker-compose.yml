services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermion
      POSTGRES_PASSWORD: hermion
      POSTGRES_DB: hermion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermion"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hermion:hermion@postgres:5432/hermion
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
